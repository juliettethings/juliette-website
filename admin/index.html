<!doctype html>
<!--
  Decap CMS admin panel. This is the standard boilerplate — all the actual configuration
  (what content types exist, what fields each has, where images get stored) lives in
  config.yml next to this file. Juliette reaches this at yoursite.netlify.app/admin/ once
  the site is deployed and logs in with the account set up via Netlify Identity (see
  DEPLOY.md for the one-time setup steps).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager — Juliette Kim Portfolio</title>
    <link rel="icon" href="data:," />
    <!-- Netlify Identity widget: handles the login button + auth token that Decap CMS's
         git-gateway backend uses to make edits on Juliette's behalf without her needing her
         own GitHub account or a personal access token. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
    <script>
      var BlogPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var image = entry.getIn(['data', 'image']);
          var title = entry.getIn(['data', 'title']) || '';
          var text = entry.getIn(['data', 'text']) || '';
          var date = entry.getIn(['data', 'date']) || '';
          var bg = entry.getIn(['data', 'color']) || '#ffffff';
          var textColor = entry.getIn(['data', 'textColor']) || '#000000';
          var imgUrl = image ? this.props.getAsset(image).toString() : '';

          return h('div', {style: {fontFamily: 'sans-serif', maxWidth: '360px', margin: '24px auto'}},
            h('div', {style: {
              background: bg,
              color: textColor,
              borderRadius: '4px',
              overflow: 'hidden',
              boxShadow: '0 2px 12px rgba(0,0,0,0.10)'
            }},
              imgUrl ? h('img', {src: imgUrl, style: {width: '100%', display: 'block', aspectRatio: '4/3', objectFit: 'cover'}}) : null,
              h('div', {style: {padding: '20px 24px'}},
                h('div', {style: {fontSize: '11px', opacity: 0.6, marginBottom: '6px'}}, date),
                h('div', {style: {fontSize: '20px', fontWeight: '700', letterSpacing: '0.02em', marginBottom: '10px'}}, title),
                h('div', {style: {fontSize: '13px', lineHeight: '1.7', opacity: 0.85, whiteSpace: 'pre-wrap'}}, text)
              )
            )
          );
        }
      });
      CMS.registerPreviewTemplate('blog', BlogPreview);
      CMS.registerPreviewStyle('data:text/css,body{background:#f5f5f5}');
    </script>
  </body>
</html>
